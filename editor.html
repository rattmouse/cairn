<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<style>
:root{
  --bg:#fbfaf8; --panel:#f2efea; --edge:#e2ddd4; --ink:#22201d; --dim:#6d675e;
  --accent:#8a5a2b; --accent-soft:#f0e4d6; --code-bg:#f0ece5; --sel:#e6ded1;
  --note:#3d6a8f; --note-bg:#e8f0f6; --warn:#9a5b25; --warn-bg:#faeee0;
  --todo:#6b5a8f; --todo-bg:#efeaf7; --ok:#3f7d4f; --bad:#a5433a;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17161a; --panel:#1e1d22; --edge:#32303a; --ink:#e6e2dc; --dim:#98938c;
    --accent:#d69a63; --accent-soft:#3a2e22; --code-bg:#232228; --sel:#33303c;
    --note:#87b4d8; --note-bg:#1d2a35; --warn:#e0a06a; --warn-bg:#33261a;
    --todo:#b4a2dc; --todo-bg:#282235; --ok:#7fc08e; --bad:#e08a80;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.65 ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}

#app{display:flex;height:100vh}

/* ---------- sidebar ---------- */
#side{width:290px;flex:0 0 290px;background:var(--panel);border-right:1px solid var(--edge);
  display:flex;flex-direction:column;overflow:hidden}
#brand{padding:14px 16px 10px;border-bottom:1px solid var(--edge);
  display:flex;align-items:baseline;gap:8px}
#brand h1{margin:0;font-size:13px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--dim);font-weight:700}
#brand span{font-size:11px;color:var(--dim);margin-left:auto}
#tools{padding:10px 14px;border-bottom:1px solid var(--edge);display:flex;flex-direction:column;gap:8px}
#q{width:100%;padding:7px 10px;font-size:13px;color:var(--ink);background:var(--bg);
  border:1px solid var(--edge);border-radius:7px;outline:none}
#q:focus{border-color:var(--accent)}
.btn{padding:6px 11px;font-size:12.5px;background:var(--bg);border:1px solid var(--edge);
  border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.9;color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
#list{flex:1;overflow-y:auto;padding:6px 0 30px}
#sync{padding:10px 14px;border-top:1px solid var(--edge);
  display:flex;flex-direction:column;gap:6px}
#sync[hidden]{display:none}
#syncInfo{font-size:11px;color:var(--dim);line-height:1.6}
#syncInfo b{font-weight:600;color:var(--ink)}
#syncInfo .bad{color:var(--bad);font-weight:600}
.grp{padding:13px 16px 4px;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--dim)}
.item{display:block;width:100%;text-align:left;padding:6px 16px;font-size:13.5px;
  line-height:1.4;background:none;border:0;cursor:pointer;border-left:3px solid transparent}
.item:hover{background:var(--sel)}
.item.on{background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
.item .dot{color:var(--accent);font-weight:700}
.item .sub{display:block;font-size:11px;color:var(--dim);font-weight:400;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- main ---------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;align-items:center;gap:10px;padding:9px 18px;
  border-bottom:1px solid var(--edge);background:var(--panel)}
#crumb{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
  color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#status{font-size:11.5px;color:var(--dim);white-space:nowrap}
#status.dirty{color:var(--accent);font-weight:600}
#status.saved{color:var(--ok)}
#status.error{color:var(--bad);font-weight:600}
.seg{display:flex;border:1px solid var(--edge);border-radius:7px;overflow:hidden}
.seg button{padding:5px 11px;font-size:12px;background:var(--bg);border:0;cursor:pointer}
.seg button+button{border-left:1px solid var(--edge)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

#panes{flex:1;display:flex;min-height:0}
#editWrap,#viewWrap{flex:1;min-width:0;overflow:auto}
#editWrap{display:none;border-right:1px solid var(--edge)}
#viewWrap{display:none}
body.mode-edit  #editWrap{display:block}
body.mode-view  #viewWrap{display:block}
body.mode-split #editWrap,body.mode-split #viewWrap{display:block}
body.mode-edit #editWrap{border-right:0}

#ed{width:100%;height:100%;min-height:100%;padding:26px 28px 140px;border:0;outline:none;
  resize:none;background:var(--bg);color:var(--ink);tab-size:4;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;line-height:1.7}
#view{max-width:780px;margin:0 auto;padding:30px 34px 140px}

/* ---------- rendered markdown ---------- */
#view h1{font-size:26px;margin:30px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--edge)}
#view h1:first-child{margin-top:0}
#view h2{font-size:19px;margin:30px 0 10px}
#view h3{font-size:15.5px;margin:22px 0 8px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.04em}
#view p{margin:0 0 13px}
#view ul,#view ol{margin:0 0 13px;padding-left:24px}
#view li{margin:3px 0}
#view li.task{list-style:none;margin-left:-20px}
#view li.task input{margin-right:7px}
#view a{color:var(--accent)}
#view hr{border:0;border-top:1px solid var(--edge);margin:26px 0}
#view blockquote{margin:0 0 13px;padding:2px 0 2px 15px;border-left:3px solid var(--edge);color:var(--dim)}
#view code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  background:var(--code-bg);padding:1.5px 5px;border-radius:4px}
#view pre{background:var(--code-bg);border:1px solid var(--edge);border-radius:8px;
  padding:12px 14px;overflow-x:auto;margin:0 0 15px}
#view pre code{background:none;padding:0;font-size:12.5px;line-height:1.55}
#view table{border-collapse:collapse;margin:0 0 16px;font-size:13.5px;display:block;overflow-x:auto}
#view th,#view td{border:1px solid var(--edge);padding:6px 10px;text-align:left;vertical-align:top}
#view th{background:var(--panel);font-weight:600}
#view img{max-width:100%;border:1px solid var(--edge);border-radius:8px;margin:5px 0 16px;display:block}
.wl{color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor;cursor:pointer}
.wl.dead{color:var(--dim);border-bottom-style:dotted;cursor:help}
.callout{border-left:3px solid var(--note);background:var(--note-bg);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:0 0 16px}
.callout .ct{font-weight:700;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--note);margin-bottom:5px}
.callout p:last-child{margin-bottom:0}
.callout-warning{border-left-color:var(--warn);background:var(--warn-bg)}
.callout-warning .ct{color:var(--warn)}
.callout-todo{border-left-color:var(--todo);background:var(--todo-bg)}
.callout-todo .ct{color:var(--todo)}
.fm{font-size:11.5px;color:var(--dim);background:var(--panel);border:1px solid var(--edge);
  border-radius:8px;padding:8px 12px;margin:0 0 20px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}

/* ---------- dialog ---------- */
#veil{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;
  align-items:center;justify-content:center;z-index:50}
#veil.open{display:flex}
#dlg{background:var(--bg);border:1px solid var(--edge);border-radius:12px;
  padding:22px;width:min(440px,92vw);box-shadow:0 18px 50px rgba(0,0,0,.3)}
#dlg h2{margin:0 0 4px;font-size:16px}
#dlg p{margin:0 0 16px;font-size:12.5px;color:var(--dim)}
#dlg label{display:block;font-size:11.5px;color:var(--dim);margin:10px 0 4px;
  text-transform:uppercase;letter-spacing:.05em;font-weight:600}
#dlg input,#dlg select{width:100%;padding:8px 10px;font:inherit;font-size:13.5px;
  background:var(--panel);color:var(--ink);border:1px solid var(--edge);border-radius:7px;outline:none}
#dlg input:focus,#dlg select:focus{border-color:var(--accent)}
#dlgErr{color:var(--bad);font-size:12px;min-height:16px;margin-top:8px}
#dlgBtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--dim);font-size:14px;z-index:80}
@media (max-width:900px){
  #app{flex-direction:column}
  #side{width:100%;flex:0 0 auto;max-height:40vh;border-right:0;border-bottom:1px solid var(--edge)}
  body.mode-split #editWrap{display:none}
  /* Stacked, the sidebar only gets 40vh, and a two-line sync block was tall
     enough to push its own second line out through #side's overflow:hidden —
     the next-sync time was rendered but invisible. Side by side it fits, and
     the note list keeps the room it just gave up. */
  #sync{flex-direction:row;align-items:center;gap:10px;padding:8px 14px}
  #sync button{flex:0 0 auto}
  #syncInfo{line-height:1.4}
  /* Give the note list back the height the sync row costs it, but only where
     there is a sync row — a cairn started without --sync-cmd keeps the
     original 40vh. */
  body[data-sync] #side{max-height:47vh}
}
</style>
</head>
<body class="mode-split">
<div id="boot">loading vault…</div>

<div id="app">
  <aside id="side">
    <div id="brand"><h1>Notes</h1><span id="tally"></span></div>
    <div id="tools">
      <input id="q" type="search" placeholder="Search…" autocomplete="off" spellcheck="false">
      <div style="display:flex;gap:6px">
        <button class="btn" id="newBtn" style="flex:1">New note</button>
        <button class="btn danger" id="trashBtn" title="Move to .trash/">Trash</button>
      </div>
    </div>
    <div id="list"></div>
    <div id="sync" hidden>
      <button class="btn" id="syncBtn">Sync now</button>
      <div id="syncInfo"></div>
    </div>
  </aside>

  <main id="main">
    <div id="bar">
      <div id="crumb"></div>
      <div id="status"></div>
      <div class="seg">
        <button data-mode="edit">Edit</button>
        <button data-mode="split" class="on">Split</button>
        <button data-mode="view">Preview</button>
      </div>
      <button class="btn primary" id="saveBtn" disabled>Save</button>
    </div>
    <div id="panes">
      <div id="editWrap"><textarea id="ed" spellcheck="false" placeholder="Pick a note…"></textarea></div>
      <div id="viewWrap"><div id="view"></div></div>
    </div>
  </main>
</div>

<div id="veil"><div id="dlg">
  <h2 id="dlgTitle">New note</h2>
  <p id="dlgHint">Creates a markdown file with frontmatter already filled in.</p>
  <div id="dlgBody">
    <label for="dlgFolder">Folder</label>
    <select id="dlgFolder"></select>
    <label for="dlgName">Title</label>
    <input id="dlgName" placeholder="Note title" autocomplete="off">
  </div>
  <div id="dlgErr"></div>
  <div id="dlgBtns">
    <button class="btn" id="dlgCancel">Cancel</button>
    <button class="btn primary" id="dlgOk">Create</button>
  </div>
</div></div>

<script>
"use strict";
const TOKEN = "__NOTES_TOKEN__";

/* ============================ markdown ============================ */
/* Deliberately small: it covers the syntax this vault actually uses.  */

function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function inline(s, ctx){
  const code = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => {
    code.push("<code>" + esc(c) + "</code>");
    return "␀C" + (code.length - 1) + "␀";
  });
  s = esc(s);
  // image embeds
  s = s.replace(/!\[\[([^\]]+)\]\]/g, (m, name) => {
    name = name.trim();
    const rel = ctx.images[name];
    return rel
      ? '<img alt="' + esc(name) + '" src="/media/' + rel.split("/").map(encodeURIComponent).join("/") + "?token=" + encodeURIComponent(TOKEN) + '">'
      : '<em>[missing image: ' + esc(name) + "]</em>";
  });
  // wikilinks
  s = s.replace(/\[\[([^\]]+)\]\]/g, (m, raw) => {
    const bar = raw.indexOf("|");
    const target = (bar < 0 ? raw : raw.slice(0, bar)).trim();
    const label  = (bar < 0 ? raw : raw.slice(bar + 1)).trim();
    const path = ctx.targets[target];
    return path
      ? '<a class="wl" href="#" data-open="' + esc(path) + '">' + esc(label) + "</a>"
      : '<span class="wl dead" title="no note called that">' + esc(label) + "</span>";
  });
  // markdown links, then bare urls
  s = s.replace(/\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g,
    (m, t, u) => '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + t + "</a>");
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<>)"']+[^\s<>)"'.,;:!?])/g,
    (m, pre, u) => pre + '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + "</a>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, "$1<em>$2</em>");
  s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
  return s.replace(/␀C(\d+)␀/g, (m, i) => code[+i]);
}

function splitFm(text){
  if (!text.startsWith("---\n")) return [null, text];
  const end = text.indexOf("\n---\n", 3);
  if (end < 0) return [null, text];
  return [text.slice(4, end), text.slice(end + 5)];
}

function render(text, ctx){
  const [fm, body] = splitFm(text);
  const lines = body.split("\n");
  let out = fm !== null ? '<div class="fm">' + esc(fm.trim()) + "</div>" : "";
  let i = 0;
  const para = [];

  function flush(){
    if (!para.length) return;
    out += "<p>" + inline(para.join("\n"), ctx).replace(/\n/g, "<br>") + "</p>";
    para.length = 0;
  }

  while (i < lines.length){
    const line = lines[i];

    // fenced code
    const fence = line.match(/^```(\S*)/);
    if (fence){
      flush();
      const lang = fence[1];
      const buf = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out += "<pre><code" + (lang ? ' class="language-' + esc(lang) + '"' : "") + ">"
           + esc(buf.join("\n")) + "</code></pre>";
      continue;
    }

    // callout  > [!TYPE] title
    const call = line.match(/^>\s*\[!([A-Za-z]+)\]\s*(.*)$/);
    if (call){
      flush();
      const kind = call[1].toLowerCase();
      const title = call[2].trim() || call[1].toUpperCase();
      const buf = [];
      i++;
      while (i < lines.length && /^>/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      out += '<div class="callout callout-' + esc(kind) + '"><div class="ct">' + esc(title) + "</div>"
           + render(buf.join("\n"), ctx) + "</div>";
      continue;
    }

    // blockquote
    if (/^>\s?/.test(line)){
      flush();
      const buf = [];
      while (i < lines.length && /^>/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      out += "<blockquote>" + render(buf.join("\n"), ctx) + "</blockquote>";
      continue;
    }

    // table
    if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])){
      flush();
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(line);
      i += 2;
      let t = "<table><thead><tr>" + head.map(c => "<th>" + inline(c, ctx) + "</th>").join("") + "</tr></thead><tbody>";
      while (i < lines.length && /^\s*\|/.test(lines[i])){
        t += "<tr>" + cells(lines[i++]).map(c => "<td>" + inline(c, ctx) + "</td>").join("") + "</tr>";
      }
      out += t + "</tbody></table>";
      continue;
    }

    // heading
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h){
      flush();
      const n = h[1].length;
      out += "<h" + n + ">" + inline(h[2], ctx) + "</h" + n + ">";
      i++;
      continue;
    }

    // hr
    if (/^\s*(---|\*\*\*|___)\s*$/.test(line)){ flush(); out += "<hr>"; i++; continue; }

    // lists
    if (/^\s*([-*+]|\d+\.)\s+/.test(line)){
      flush();
      const ordered = /^\s*\d+\./.test(line);
      let l = "<" + (ordered ? "ol" : "ul") + ">";
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])){
        let item = lines[i++].replace(/^\s*([-*+]|\d+\.)\s+/, "");
        const task = item.match(/^\[([ xX])\]\s+(.*)$/);
        if (task){
          l += '<li class="task"><input type="checkbox" disabled'
             + (task[1].toLowerCase() === "x" ? " checked" : "") + ">"
             + inline(task[2], ctx) + "</li>";
        } else {
          l += "<li>" + inline(item, ctx) + "</li>";
        }
        // indented continuation
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(lines[i])){
          l = l.replace(/<\/li>$/, "<br>" + inline(lines[i++].trim(), ctx) + "</li>");
        }
      }
      out += l + "</" + (ordered ? "ol" : "ul") + ">";
      continue;
    }

    if (!line.trim()){ flush(); i++; continue; }
    para.push(line);
    i++;
  }
  flush();
  return out;
}

/* ============================== state ============================== */
let NOTES = [], IMAGES = {}, TARGETS = {};
let current = null, dirty = false, saving = false;

const $ = id => document.getElementById(id);
const listEl = $("list"), edEl = $("ed"), viewEl = $("view");
const statusEl = $("status"), crumbEl = $("crumb"), saveBtn = $("saveBtn"), qEl = $("q");

function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({"X-Notes-Token": TOKEN}, opts.headers || {});
  if (opts.body) opts.headers["Content-Type"] = "application/json";
  return fetch(path, opts).then(async r => {
    const j = await r.json().catch(() => ({ok:false, error:"bad response from server"}));
    if (!r.ok || j.ok === false) throw new Error(j.error || ("HTTP " + r.status));
    return j;
  });
}

function buildTargets(){
  TARGETS = {};
  for (const n of NOTES){
    const stem = n.path.split("/").pop().replace(/\.md$/, "");
    if (!(stem in TARGETS)) TARGETS[stem] = n.path;
    if (!(n.title in TARGETS)) TARGETS[n.title] = n.path;
  }
}
const ctx = () => ({images: IMAGES, targets: TARGETS});

function setStatus(text, cls){
  statusEl.textContent = text;
  statusEl.className = cls || "";
}

function setDirty(v){
  dirty = v;
  saveBtn.disabled = !v || saving;
  if (v) setStatus("unsaved changes", "dirty");
  drawList(qEl.value);
}

function drawList(filter){
  const f = (filter || "").trim().toLowerCase();
  const shown = f ? NOTES.filter(n =>
    (n.title + " " + n.path + " " + n.tags.join(" ") + " " + n.raw).toLowerCase().includes(f)) : NOTES;
  listEl.innerHTML = "";
  let folder = null;
  for (const n of shown){
    if (n.folder !== folder){
      folder = n.folder;
      const g = document.createElement("div");
      g.className = "grp";
      g.textContent = folder === "(root)" ? "Vault root" : folder;
      listEl.appendChild(g);
    }
    const b = document.createElement("button");
    b.className = "item" + (current && n.path === current.path ? " on" : "");
    b.dataset.open = n.path;
    b.textContent = n.title;
    if (dirty && current && n.path === current.path){
      const d = document.createElement("span");
      d.className = "dot"; d.textContent = " ●";
      b.appendChild(d);
    }
    listEl.appendChild(b);
  }
  $("tally").textContent = f ? shown.length + "/" + NOTES.length : NOTES.length + " notes";
  if (f && !shown.length){
    const g = document.createElement("div");
    g.className = "grp"; g.textContent = "no matches";
    listEl.appendChild(g);
  }
}

function preview(){
  viewEl.innerHTML = render(edEl.value, ctx());
}

function open_(path){
  if (dirty && !confirm("You have unsaved changes. Discard them?")) return;
  const n = NOTES.find(x => x.path === path);
  if (!n) return;
  current = n;
  edEl.value = n.raw;
  crumbEl.textContent = n.path;
  preview();
  setDirty(false);
  setStatus("", "");
  document.title = n.title + " — Notes";
  $("trashBtn").disabled = false;
  drawList(qEl.value);
}

async function save(){
  if (!current || !dirty || saving) return;
  saving = true; saveBtn.disabled = true;
  setStatus("saving…", "");
  try{
    const r = await api("/api/note", {
      method: "PUT",
      body: JSON.stringify({path: current.path, content: edEl.value, mtime: current.mtime})
    });
    current.raw = r.content;
    current.mtime = r.mtime;
    if (edEl.value !== r.content){        // server refreshed `updated:`
      const at = edEl.selectionStart;
      edEl.value = r.content;
      edEl.setSelectionRange(at, at);
    }
    const meta = splitFm(r.content)[0] || "";
    const t = meta.match(/^title:\s*(.+)$/m);
    if (t) current.title = t[1].trim();
    saving = false;
    setDirty(false);
    setStatus("saved" + (r.backup ? " · previous kept in .backups/" : ""), "saved");
    preview();
    setTimeout(() => { if (!dirty) setStatus("", ""); }, 4000);
  } catch (e){
    saving = false;
    saveBtn.disabled = false;
    setStatus(e.message, "error");
    if (/changed on disk/.test(e.message)){
      alert("This note changed on disk since you opened it — probably edited in another "
          + "program.\n\nYour text here has NOT been saved. Copy anything you want to keep, "
          + "then reload the page to pick up the version on disk.");
    }
  }
}

/* ---------------------------- dialog ---------------------------- */
let dlgMode = "new";
function openDialog(){
  dlgMode = "new";
  const folders = [...new Set(NOTES.map(n => n.folder))].sort();
  $("dlgFolder").innerHTML = folders
    .map(f => '<option value="' + esc(f) + '">' + esc(f === "(root)" ? "Vault root" : f) + "</option>")
    .join("");
  if (current) $("dlgFolder").value = current.folder;
  $("dlgName").value = "";
  $("dlgErr").textContent = "";
  $("veil").classList.add("open");
  $("dlgName").focus();
}
function closeDialog(){ $("veil").classList.remove("open"); }

async function createNote(){
  const title = $("dlgName").value.trim();
  if (!title){ $("dlgErr").textContent = "Give it a title."; return; }
  if (/[\/\\:*?"<>|]/.test(title)){ $("dlgErr").textContent = "Avoid / \\ : * ? \" < > | in the title."; return; }
  const folder = $("dlgFolder").value;
  const path = (folder === "(root)" ? "" : folder + "/") + title + ".md";
  try{
    const r = await api("/api/new", {method: "POST", body: JSON.stringify({path, title})});
    await reload();
    closeDialog();
    open_(r.path);
    edEl.focus();
    edEl.setSelectionRange(edEl.value.length, edEl.value.length);
  } catch (e){
    $("dlgErr").textContent = e.message;
  }
}

async function trashNote(){
  if (!current) return;
  if (!confirm('Move "' + current.title + '" to .trash/?\n\nThe file is moved, not deleted — '
             + "you can pull it back out of that folder.")) return;
  try{
    const r = await api("/api/trash", {method: "POST", body: JSON.stringify({path: current.path})});
    const gone = current.path;
    current = null; dirty = false;
    edEl.value = ""; viewEl.innerHTML = ""; crumbEl.textContent = "";
    await reload();
    setStatus("moved to " + r.trashed, "saved");
    $("trashBtn").disabled = true;
    if (NOTES.length) open_(NOTES[0].path);
  } catch (e){ setStatus(e.message, "error"); }
}

/* ----------------------------- sync ----------------------------- */
/* The button is hidden unless the server was started with --sync-cmd, so a
   plain cairn looks exactly as it did before.                              */

const syncEl = $("sync"), syncBtn = $("syncBtn"), syncInfo = $("syncInfo");
let SYNC = null;

function rel(t){
  const delta = t * 1000 - Date.now(), ahead = delta > 0;
  const s = Math.abs(delta) / 1000;
  let n, unit;
  if (s < 45)         { return ahead ? "in a moment" : "just now"; }
  else if (s < 3600)  { n = Math.round(s / 60);    unit = "minute"; }
  else if (s < 86400) { n = Math.round(s / 3600);  unit = "hour"; }
  else                { n = Math.round(s / 86400); unit = "day"; }
  const phrase = n + " " + unit + (n === 1 ? "" : "s");
  return ahead ? "in " + phrase : phrase + " ago";
}

function drawSync(){
  const s = SYNC;
  /* An attribute rather than a class: the Edit/Split/Preview buttons assign
     body.className outright, which would silently drop a class set here. */
  if (s && s.enabled) document.body.dataset.sync = "on";
  else delete document.body.dataset.sync;
  if (!s || !s.enabled){ syncEl.hidden = true; return; }
  syncEl.hidden = false;
  syncBtn.disabled = !!s.running;
  syncBtn.textContent = s.running ? "Syncing…" : "Sync now";

  /* A run started by the timer never passes through cairn, so its time comes
     from systemd and the button's own runs come from the state file. Whichever
     is more recent is the one that actually touched the notes.             */
  const mine = s.last && s.last.at, theirs = s.timer_last;
  const last = Math.max(mine || 0, theirs || 0) || null;
  const failed = s.last && !s.last.ok && mine && mine >= (theirs || 0);

  const bits = [];
  if (last) bits.push("Last sync <b>" + esc(rel(last)) + "</b>" +
                      (failed ? ' <span class="bad">— failed</span>' : ""));
  else      bits.push("No sync yet");
  if (s.next) bits.push("Next <b>" + esc(rel(s.next)) + "</b>");
  syncInfo.innerHTML = bits.join("<br>");
}

async function refreshSync(){
  try {
    SYNC = (await api("/api/sync/status")).sync;
  } catch (e){
    SYNC = null;                         /* server too old, or not unlocked */
  }
  drawSync();
}

async function doSync(){
  /* A sync rewrites notes on disk. Anything unsaved in the textarea would be
     silently outrun by it, so make the user deal with that first.          */
  if (dirty){
    setStatus("save or discard your changes first — a sync can overwrite this note", "error");
    return;
  }
  syncBtn.disabled = true;
  syncBtn.textContent = "Syncing…";
  setStatus("syncing…");
  try {
    const record = (await api("/api/sync", {method: "POST"})).sync;
    /* The notes on disk may have changed underneath us, including the open
       one. Not dirty, so reopening it cannot lose anything.                */
    const was = current && current.path;
    await reload();
    if (was) open_(was);
    /* After the reopen, never before: open_ clears the status line, which
       would swallow the message this whole function exists to deliver.     */
    if (record.ok){
      setStatus("sync finished in " + record.seconds + "s", "saved");
    } else {
      /* The exit code alone tells the user nothing. The script's last line is
         usually the reason it stopped, and is the only part of the output that
         reaches the page at all.                                            */
      const lines = (record.output || "").trim().split("\n").filter(l => l.trim());
      const why = lines.length ? lines[lines.length - 1].slice(0, 140) : "";
      setStatus("sync failed" + (record.code == null ? "" : " (exit " + record.code + ")")
                + (why ? " — " + why : ""), "error");
      if (record.output) console.error(record.output);
    }
  } catch (e){
    setStatus(e.message, "error");
  }
  await refreshSync();
}

/* ---------------------------- boot ---------------------------- */
async function reload(){
  const r = await api("/api/notes");
  NOTES = r.notes; IMAGES = r.images;
  buildTargets();
  if (current){
    const again = NOTES.find(n => n.path === current.path);
    current = again || null;
  }
  drawList(qEl.value);
}

listEl.addEventListener("click", e => {
  const b = e.target.closest("[data-open]");
  if (b) open_(b.dataset.open);
});
viewEl.addEventListener("click", e => {
  const a = e.target.closest("a.wl[data-open]");
  if (a){ e.preventDefault(); open_(a.dataset.open); }
});
edEl.addEventListener("input", () => { if (!dirty) setDirty(true); preview(); });
edEl.addEventListener("keydown", e => {
  if (e.key === "Tab"){
    e.preventDefault();
    const s = edEl.selectionStart, t = edEl.selectionEnd;
    edEl.value = edEl.value.slice(0, s) + "  " + edEl.value.slice(t);
    edEl.setSelectionRange(s + 2, s + 2);
    if (!dirty) setDirty(true);
    preview();
  }
});
qEl.addEventListener("input", () => drawList(qEl.value));
saveBtn.addEventListener("click", save);
syncBtn.addEventListener("click", doSync);
/* Re-render often enough that "in 25 minutes" stays honest, but only ask the
   server every few minutes — each status call spawns a systemctl.          */
setInterval(drawSync, 30 * 1000);
setInterval(refreshSync, 5 * 60 * 1000);
$("newBtn").addEventListener("click", openDialog);
$("trashBtn").addEventListener("click", trashNote);
$("dlgCancel").addEventListener("click", closeDialog);
$("dlgOk").addEventListener("click", createNote);
$("dlgName").addEventListener("keydown", e => { if (e.key === "Enter") createNote(); });
$("veil").addEventListener("click", e => { if (e.target === $("veil")) closeDialog(); });

document.querySelectorAll(".seg button").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".seg button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    document.body.className = "mode-" + b.dataset.mode;
    try { localStorage.setItem("notes-mode", b.dataset.mode); } catch (e) {}
  });
});

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s"){ e.preventDefault(); save(); }
  if ((e.ctrlKey || e.metaKey) && e.key === "n"){ e.preventDefault(); openDialog(); }
  if (e.key === "Escape"){
    if ($("veil").classList.contains("open")) closeDialog();
    else if (document.activeElement === qEl){ qEl.value = ""; drawList(""); qEl.blur(); }
  }
  if (e.key === "/" && document.activeElement !== qEl && document.activeElement !== edEl
      && !$("veil").classList.contains("open")){
    e.preventDefault(); qEl.focus(); qEl.select();
  }
});

window.addEventListener("beforeunload", e => {
  if (dirty){ e.preventDefault(); e.returnValue = ""; }
});

(async function(){
  try{
    let mode = null;
    try { mode = localStorage.getItem("notes-mode"); } catch (e) {}
    if (mode){
      document.body.className = "mode-" + mode;
      document.querySelectorAll(".seg button").forEach(x =>
        x.classList.toggle("on", x.dataset.mode === mode));
    }
    await reload();
    $("boot").remove();
    const readme = NOTES.find(n => n.path === "README.md") || NOTES[0];
    if (readme) open_(readme.path);
    /* After the notes are up: the sidebar is usable without it, and it is the
       one call that can spawn a subprocess on the server.                   */
    refreshSync();
  } catch (e){
    $("boot").textContent = "Could not reach the notes server: " + e.message;
  }
})();
</script>
</body>
