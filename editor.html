<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<style>
:root{
  --bg:#fbfaf8; --panel:#f2efea; --edge:#e2ddd4; --ink:#22201d; --dim:#6d675e;
  --accent:#8a5a2b; --accent-soft:#f0e4d6; --code-bg:#f0ece5; --sel:#e6ded1;
  --note:#3d6a8f; --note-bg:#e8f0f6; --warn:#9a5b25; --warn-bg:#faeee0;
  --todo:#6b5a8f; --todo-bg:#efeaf7; --ok:#3f7d4f; --bad:#a5433a;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17161a; --panel:#1e1d22; --edge:#32303a; --ink:#e6e2dc; --dim:#98938c;
    --accent:#d69a63; --accent-soft:#3a2e22; --code-bg:#232228; --sel:#33303c;
    --note:#87b4d8; --note-bg:#1d2a35; --warn:#e0a06a; --warn-bg:#33261a;
    --todo:#b4a2dc; --todo-bg:#282235; --ok:#7fc08e; --bad:#e08a80;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.65 ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}

/* Three columns over one footer. The columns scroll; the page never does. */
#app{display:flex;flex-direction:column;height:100vh}
#shell{flex:1;display:flex;min-height:0}

/* ---------- side panels ---------- */
#side{width:290px;flex:0 0 290px;background:var(--panel);border-right:1px solid var(--edge);
  display:flex;flex-direction:column;overflow:hidden}
/* Attributes rather than classes: the Edit/Split/Preview buttons assign
   body.className outright, which would silently drop a class set here. */
body[data-left="off"] #side{display:none}
body[data-right="off"] #outline{display:none}
#brand{padding:14px 16px 10px;border-bottom:1px solid var(--edge);
  display:flex;align-items:baseline;gap:8px}
#brand h1{margin:0;font-size:13px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--dim);font-weight:700}
#brand span{font-size:11px;color:var(--dim);margin-left:auto}
#tools{padding:10px 14px;border-bottom:1px solid var(--edge);display:flex;flex-direction:column;gap:8px}
#q{width:100%;padding:7px 10px;font-size:13px;color:var(--ink);background:var(--bg);
  border:1px solid var(--edge);border-radius:7px;outline:none}
#q:focus{border-color:var(--accent)}
.btn{padding:6px 11px;font-size:12.5px;background:var(--bg);border:1px solid var(--edge);
  border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.9;color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
#list{flex:1;overflow-y:auto;padding:6px 0 30px}
.grp{padding:13px 16px 4px;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--dim)}

/* One row shape for both halves of the tree: the twisty column keeps folder
   names and note titles on the same left edge at a given depth. */
.row{display:flex;align-items:center;gap:5px;width:100%;text-align:left;
  padding:4px 12px 4px 0;font-size:13.5px;line-height:1.35;background:none;
  border:0;border-left:3px solid transparent;cursor:pointer}
.row:hover{background:var(--sel)}
.row .tw{flex:0 0 12px;font-size:8px;color:var(--dim);text-align:center;
  transition:transform .12s}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ct{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.row .mk{color:var(--accent);font-weight:700}
.row.dir{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--dim)}
.row.dir:hover{color:var(--ink)}
.row.shut .tw{transform:rotate(-90deg)}
.row.on{background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}

/* ---------- main ---------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;align-items:center;gap:10px;padding:9px 18px;
  border-bottom:1px solid var(--edge);background:var(--panel)}
#crumb{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
  color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#status{font-size:11.5px;color:var(--dim);white-space:nowrap}
#status.dirty{color:var(--accent);font-weight:600}
#status.saved{color:var(--ok)}
#status.error{color:var(--bad);font-weight:600}
.seg{display:flex;border:1px solid var(--edge);border-radius:7px;overflow:hidden}
.seg button{padding:5px 11px;font-size:12px;background:var(--bg);border:0;cursor:pointer}
.seg button+button{border-left:1px solid var(--edge)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

.tog{padding:5px 9px;font-size:11.5px;color:var(--dim);background:var(--bg);
  border:1px solid var(--edge);border-radius:7px;cursor:pointer;white-space:nowrap}
.tog:hover{border-color:var(--accent);color:var(--accent)}
.tog.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
/* Something cairn is running, whether or not the panel is open to show it. */
.tog.busy{border-color:var(--accent);color:var(--accent)}
.tog.busy::before{content:"";display:inline-block;width:6px;height:6px;margin-right:6px;
  border-radius:50%;background:var(--accent);animation:pulse 1.1s ease-in-out infinite}

/* ---------- outline ---------- */
#outline{width:250px;flex:0 0 250px;background:var(--panel);border-left:1px solid var(--edge);
  display:flex;flex-direction:column;overflow:hidden}
.phead{padding:14px 16px 10px;border-bottom:1px solid var(--edge);display:flex;
  align-items:baseline;gap:8px;font-size:13px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--dim);font-weight:700}
.phead span{font-size:11px;font-weight:400;letter-spacing:0;text-transform:none;margin-left:auto}
#outBody{flex:1;overflow-y:auto;padding:8px 0 30px}
#outBody .none{padding:10px 16px;font-size:12px;color:var(--dim)}
.o{display:flex;gap:6px;align-items:baseline;width:100%;text-align:left;
  padding:3px 12px 3px 13px;font-size:12.5px;line-height:1.45;color:var(--ink);
  background:none;border:0;border-left:3px solid transparent;cursor:pointer;
  text-decoration:none}
.o:hover{background:var(--sel)}
.o .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.o.here{background:var(--accent-soft);border-left-color:var(--accent);color:var(--accent)}
.o.h1{font-weight:700}
.o.h2{padding-left:25px}
.o.h3{padding-left:37px;color:var(--dim)}
.o.h4,.o.h5,.o.h6{padding-left:49px;color:var(--dim)}
.o.code .nm{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
  color:var(--dim)}
.o .host{flex:0 0 auto;max-width:45%;font-size:10.5px;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis}
.o .tag{flex:0 0 auto;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
  font-weight:700;color:var(--accent);background:var(--accent-soft);
  border-radius:4px;padding:1px 5px}
.o.dead{cursor:help}
.o.dead .nm{color:var(--dim);text-decoration:line-through}
.o.link .nm{color:var(--accent)}
.osec{padding:16px 16px 5px;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--dim);border-top:1px solid var(--edge);margin-top:10px}

/* ---------- footer ---------- */
#foot{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--edge);
  display:flex;flex-direction:column}
#console{display:none;height:min(230px,32vh);overflow-y:auto;background:var(--bg);
  border-bottom:1px solid var(--edge);padding:9px 14px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.6}
body[data-console="on"] #console{display:block}
#console .idle{color:var(--dim)}
.ln{display:flex;gap:9px;white-space:pre-wrap;word-break:break-word}
.ln .t{flex:0 0 auto;color:var(--dim);font-variant-numeric:tabular-nums}
.ln .m{flex:1;min-width:0}
.ln.start .m,.ln.end .m{font-weight:700}
.ln.start .m{color:var(--accent)}
.ln.end .m{color:var(--ok)}
.ln.err .m{color:var(--bad)}
.ln.term .m{color:var(--note)}
#footbar{display:flex;align-items:center;gap:16px;padding:5px 14px;min-height:32px;
  font-size:11.5px;color:var(--dim)}
.chip{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.chip b{color:var(--ink);font-weight:600}
.chip .bad{color:var(--bad);font-weight:600}
.chip .sep{opacity:.5;padding:0 1px}
.dot{flex:0 0 7px;width:7px;height:7px;border-radius:50%;background:var(--dim);opacity:.55}
.dot.ok{background:var(--ok);opacity:1}
.dot.warn{background:var(--warn);opacity:1}
.dot.bad{background:var(--bad);opacity:1}
.dot.run{background:var(--accent);opacity:1;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot.run{animation:none}}
#ver{flex:0 0 auto;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  font-weight:700;color:var(--dim);opacity:.75}
#footgap{flex:1;min-width:8px}
#footbar .btn{padding:4px 9px;font-size:11.5px}
#footbar .btn[hidden]{display:none}

#panes{flex:1;display:flex;min-height:0}
#editWrap,#viewWrap,#liveWrap{flex:1;min-width:0;overflow:auto}
#editWrap{display:none;border-right:1px solid var(--edge)}
#viewWrap,#liveWrap{display:none}
body.mode-edit  #editWrap{display:block}
body.mode-view  #viewWrap{display:block}
body.mode-live  #liveWrap{display:block}
body.mode-split #editWrap,body.mode-split #viewWrap{display:block}
body.mode-edit #editWrap{border-right:0}

#ed{width:100%;height:100%;min-height:100%;padding:26px 28px 140px;border:0;outline:none;
  resize:none;background:var(--bg);color:var(--ink);tab-size:4;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;line-height:1.7}
#view,#live{max-width:780px;margin:0 auto;padding:30px 34px 140px}

/* ---------- live mode ---------- */
/* The note reads as the preview does, one rendered block at a time, until the
   caret lands in a block — that one shows its markdown instead. So the raw
   text is only ever where you are working, and the rest of the note stays
   readable while you work on it. */
.blk{position:relative}
/* Consecutive list items are separate blocks so that only the item you are in
   goes raw. Rendered, each is its own one-item list, and the margins between
   them have to be taken back out or the list falls apart into paragraphs. */
.blk[data-run="start"] ul,.blk[data-run="start"] ol,
.blk[data-run="mid"]   ul,.blk[data-run="mid"]   ol{margin-bottom:0}
.blk[data-run="mid"]   ul,.blk[data-run="mid"]   ol,
.blk[data-run="end"]   ul,.blk[data-run="end"]   ol{margin-top:0}
#live > .blk:first-child h1{margin-top:0}
#live > .blk:first-child > .fm{margin-top:0}

/* The block being edited. Same width, same left edge and the same font as the
   text it replaced, so switching between them does not shift the page around;
   the tint and the bar in the margin are what say which one you are in. */
.raw{display:block;width:100%;margin:0 0 13px;padding:2px 0 2px 12px;border:0;
  border-left:2px solid var(--accent);border-radius:0 4px 4px 0;
  background:var(--accent-soft);color:var(--ink);
  font:inherit;tab-size:4;outline:none;resize:none;overflow:hidden;
  white-space:pre-wrap;word-break:break-word}
.raw.h1{font-size:26px;font-weight:700;line-height:1.3;margin:30px 0 12px}
.raw.h2{font-size:19px;font-weight:700;line-height:1.35;margin:30px 0 10px}
.raw.h3,.raw.h4,.raw.h5,.raw.h6{font-size:15.5px;font-weight:700;margin:22px 0 8px;
  text-transform:uppercase;letter-spacing:.04em;color:var(--dim)}
.raw.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  line-height:1.55;margin:0 0 15px;padding:12px 14px 12px 12px}
.raw.table{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  line-height:1.6;margin:0 0 16px}
.raw.fm{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
  line-height:1.6;margin:0 0 20px;padding:8px 12px 8px 12px}
.raw.li{margin:3px 0 3px 24px;width:calc(100% - 24px)}
.raw.hr{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin:26px 0}
#live .hint{margin:34px 0 0;font-size:12px;color:var(--dim);border-top:1px solid var(--edge);
  padding-top:12px}

/* ---------- rendered markdown ---------- */
.md h1{font-size:26px;margin:30px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--edge)}
.md h1:first-child{margin-top:0}
.md h2{font-size:19px;margin:30px 0 10px}
.md h3{font-size:15.5px;margin:22px 0 8px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.04em}
.md p{margin:0 0 13px}
.md ul,.md ol{margin:0 0 13px;padding-left:24px}
.md li{margin:3px 0}
.md li.task{list-style:none;margin-left:-20px}
.md li.task input{margin-right:7px}
.md a{color:var(--accent)}
.md hr{border:0;border-top:1px solid var(--edge);margin:26px 0}
.md blockquote{margin:0 0 13px;padding:2px 0 2px 15px;border-left:3px solid var(--edge);color:var(--dim)}
.md code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  background:var(--code-bg);padding:1.5px 5px;border-radius:4px}
.md pre{background:var(--code-bg);border:1px solid var(--edge);border-radius:8px;
  padding:12px 14px;overflow-x:auto;margin:0 0 15px}
.md pre code{background:none;padding:0;font-size:12.5px;line-height:1.55}
.cb{position:relative;margin:0 0 15px}
.cb pre{margin:0}
.cb .cbtools{position:absolute;top:5px;right:5px;display:flex;gap:4px;padding:3px;
  background:var(--panel);border:1px solid var(--edge);border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.14);opacity:0;transition:opacity .12s}
.cb:hover .cbtools,.cb:focus-within .cbtools{opacity:1}
@media (hover:none){.cb .cbtools{opacity:1}}
.cbtools button{padding:2px 9px;font-size:11px;line-height:1.6;color:var(--dim);
  background:var(--bg);border:1px solid var(--edge);border-radius:6px;cursor:pointer;
  white-space:nowrap}
.cbtools button:hover{border-color:var(--accent);color:var(--accent)}
.cbtools button.done{border-color:var(--ok);color:var(--ok)}
.cbtools button.bad{border-color:var(--bad);color:var(--bad)}
.md table{border-collapse:collapse;margin:0 0 16px;font-size:13.5px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--edge);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--panel);font-weight:600}
.md img{max-width:100%;border:1px solid var(--edge);border-radius:8px;margin:5px 0 16px;display:block}
.wl{color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor;cursor:pointer}
.wl.dead{color:var(--dim);border-bottom-style:dotted;cursor:help}
.callout{border-left:3px solid var(--note);background:var(--note-bg);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:0 0 16px}
.callout .ct{font-weight:700;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--note);margin-bottom:5px}
.callout p:last-child{margin-bottom:0}
.callout-warning{border-left-color:var(--warn);background:var(--warn-bg)}
.callout-warning .ct{color:var(--warn)}
.callout-todo{border-left-color:var(--todo);background:var(--todo-bg)}
.callout-todo .ct{color:var(--todo)}
.fm{font-size:11.5px;color:var(--dim);background:var(--panel);border:1px solid var(--edge);
  border-radius:8px;padding:8px 12px;margin:0 0 20px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}

/* ---------- dialog ---------- */
#veil{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;
  align-items:center;justify-content:center;z-index:50}
#veil.open{display:flex}
#dlg{background:var(--bg);border:1px solid var(--edge);border-radius:12px;
  padding:22px;width:min(440px,92vw);box-shadow:0 18px 50px rgba(0,0,0,.3)}
#dlg h2{margin:0 0 4px;font-size:16px}
#dlg p{margin:0 0 16px;font-size:12.5px;color:var(--dim)}
#dlg label{display:block;font-size:11.5px;color:var(--dim);margin:10px 0 4px;
  text-transform:uppercase;letter-spacing:.05em;font-weight:600}
#dlg input,#dlg select{width:100%;padding:8px 10px;font:inherit;font-size:13.5px;
  background:var(--panel);color:var(--ink);border:1px solid var(--edge);border-radius:7px;outline:none}
#dlg input:focus,#dlg select:focus{border-color:var(--accent)}
#dlgErr{color:var(--bad);font-size:12px;min-height:16px;margin-top:8px}
#dlgBtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--dim);font-size:14px;z-index:80}
/* Anywhere the outline can jump to. The margin keeps a heading off the very
   top edge of the pane it just scrolled into. */
.md [id^="L"]{scroll-margin-top:14px}

@media (max-width:900px){
  /* Too narrow for three columns: a panel that is on covers the note instead
     of squeezing it, and only one of them can be on at a time (see openPanel).
     Both start off, so a phone opens on the note itself. */
  #shell{position:relative}
  #side,#outline{position:absolute;top:0;bottom:0;z-index:20;width:min(320px,84vw);
    flex:0 0 auto;box-shadow:0 0 40px rgba(0,0,0,.28)}
  #side{left:0}
  #outline{right:0}
  body.mode-split #editWrap{display:none}
  #footbar{flex-wrap:wrap;gap:6px 14px;padding:6px 12px}
  /* Narrow enough that the path in the title bar is what has to give: the
     mode buttons and Save cannot shrink past their own words, and squeezing
     them was pushing Preview underneath Save. */
  #crumb{display:none}
  #bar{gap:6px;padding:8px 10px}
  #status{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .seg button{padding:5px 8px}
  #footgap{display:none}
  #console{height:min(200px,40vh)}
}
</style>
</head>
<body class="mode-split">
<div id="boot">loading vault…</div>

<div id="app">
  <div id="shell">
    <aside id="side">
      <div id="brand"><h1>Notes</h1><span id="tally"></span></div>
      <div id="tools">
        <input id="q" type="search" placeholder="Search…" autocomplete="off" spellcheck="false">
        <div style="display:flex;gap:6px">
          <button class="btn" id="newBtn" style="flex:1">New note</button>
          <button class="btn danger" id="trashBtn" title="Move to trash/">Trash</button>
        </div>
      </div>
      <div id="list"></div>
    </aside>

    <main id="main">
      <div id="bar">
        <button class="tog" id="leftBtn" title="Notes panel (Ctrl/⌘-B)">Notes</button>
        <div id="crumb"></div>
        <div id="status"></div>
        <div class="seg">
          <button data-mode="edit" title="Markdown source only">Edit</button>
          <button data-mode="split" class="on" title="Source and preview side by side">Split</button>
          <button data-mode="live" title="Rendered, except the block you are in">Live</button>
          <button data-mode="view" title="Rendered only">Preview</button>
        </div>
        <button class="btn primary" id="saveBtn" disabled>Save</button>
        <button class="tog" id="rightBtn" title="Outline (Ctrl/⌘-E)">Outline</button>
      </div>
      <div id="panes">
        <div id="editWrap"><textarea id="ed" spellcheck="false" placeholder="Pick a note…"></textarea></div>
        <div id="viewWrap"><div id="view" class="md"></div></div>
        <div id="liveWrap"><div id="live" class="md"></div></div>
      </div>
    </main>

    <aside id="outline">
      <div class="phead">Outline<span id="outTally"></span></div>
      <div id="outBody"></div>
    </aside>
  </div>

  <footer id="foot">
    <div id="console"><div class="idle">Nothing has run yet.</div></div>
    <div id="footbar">
      <span id="ver" title="cairn — a small browser editor for a folder of markdown notes">cairn</span>
      <div class="chip" id="cloudChip"></div>
      <div class="chip" id="gitChip"></div>
      <div id="footgap"></div>
      <div class="chip" id="syncChip"></div>
      <button class="btn" id="syncBtn" hidden>Sync now</button>
      <button class="tog" id="consoleBtn" title="What cairn has run (Ctrl/⌘-J)">Activity</button>
    </div>
  </footer>
</div>

<div id="veil"><div id="dlg">
  <h2 id="dlgTitle">New note</h2>
  <p id="dlgHint">Creates a markdown file with frontmatter already filled in.</p>
  <div id="dlgBody">
    <label for="dlgFolder">Folder</label>
    <select id="dlgFolder"></select>
    <label for="dlgName">Title</label>
    <input id="dlgName" placeholder="Note title" autocomplete="off">
  </div>
  <div id="dlgErr"></div>
  <div id="dlgBtns">
    <button class="btn" id="dlgCancel">Cancel</button>
    <button class="btn primary" id="dlgOk">Create</button>
  </div>
</div></div>

<script>
"use strict";
const TOKEN = "__NOTES_TOKEN__";

/* ============================ markdown ============================ */
/* Deliberately small: it covers the syntax this vault actually uses.  */

function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function inline(s, ctx){
  const code = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => {
    code.push("<code>" + esc(c) + "</code>");
    return "␀C" + (code.length - 1) + "␀";
  });
  s = esc(s);
  // image embeds
  s = s.replace(/!\[\[([^\]]+)\]\]/g, (m, name) => {
    name = name.trim();
    const rel = ctx.images[name];
    return rel
      ? '<img alt="' + esc(name) + '" src="/media/' + rel.split("/").map(encodeURIComponent).join("/") + "?token=" + encodeURIComponent(TOKEN) + '">'
      : '<em>[missing image: ' + esc(name) + "]</em>";
  });
  // wikilinks
  s = s.replace(/\[\[([^\]]+)\]\]/g, (m, raw) => {
    const bar = raw.indexOf("|");
    const target = (bar < 0 ? raw : raw.slice(0, bar)).trim();
    const label  = (bar < 0 ? raw : raw.slice(bar + 1)).trim();
    const path = ctx.targets[target];
    return path
      ? '<a class="wl" href="#" data-open="' + esc(path) + '">' + esc(label) + "</a>"
      : '<span class="wl dead" title="no note called that">' + esc(label) + "</span>";
  });
  // markdown links, then bare urls
  s = s.replace(/\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g,
    (m, t, u) => '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + t + "</a>");
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<>)"']+[^\s<>)"'.,;:!?])/g,
    (m, pre, u) => pre + '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + "</a>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, "$1<em>$2</em>");
  s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
  return s.replace(/␀C(\d+)␀/g, (m, i) => code[+i]);
}

function splitFm(text){
  if (!text.startsWith("---\n")) return [null, text];
  const end = text.indexOf("\n---\n", 3);
  if (end < 0) return [null, text];
  return [text.slice(4, end), text.slice(end + 5)];
}

/* Languages where "open in terminal" means anything. A bare fence in these
   notes is nearly always a shell command, so it counts; a ```python block
   does not, and gets Copy alone. */
const SHELLISH = ["", "sh", "bash", "zsh", "shell", "console", "terminal", "shell-session"];

function codeTools(lang){
  let html = '<div class="cbtools"><button type="button" data-cb="copy">copy</button>';
  if (TERMINAL_OK && SHELLISH.includes((lang || "").toLowerCase()))
    html += '<button type="button" data-cb="term" title="Open a terminal with this '
          + 'typed at the prompt. It is not run.">terminal</button>';
  return html + "</div>";
}

/* `base` is the line this text started on inside the note body, so that the
   headings and code blocks the renderer emits can carry an id naming their
   source line — which is the one thing the outline in the right-hand panel
   and the textarea on the left can both agree on. Nested renders (callouts,
   blockquotes) pass their own offset down rather than restarting at zero. */
function render(text, ctx, base){
  base = base || 0;
  const [fm, body] = splitFm(text);
  const lines = body.split("\n");
  let out = fm !== null ? '<div class="fm">' + esc(fm.trim()) + "</div>" : "";
  let i = 0;
  const para = [];

  function flush(){
    if (!para.length) return;
    out += "<p>" + inline(para.join("\n"), ctx).replace(/\n/g, "<br>") + "</p>";
    para.length = 0;
  }

  while (i < lines.length){
    const line = lines[i];

    // fenced code
    const fence = line.match(/^```(\S*)/);
    if (fence){
      flush();
      const lang = fence[1];
      const buf = [];
      const at = i;
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out += '<div class="cb" id="L' + (base + at) + '">' + codeTools(lang)
           + "<pre><code" + (lang ? ' class="language-' + esc(lang) + '"' : "") + ">"
           + esc(buf.join("\n")) + "</code></pre></div>";
      continue;
    }

    // callout  > [!TYPE] title
    const call = line.match(/^>\s*\[!([A-Za-z]+)\]\s*(.*)$/);
    if (call){
      flush();
      const kind = call[1].toLowerCase();
      const title = call[2].trim() || call[1].toUpperCase();
      const buf = [];
      const at = i;
      i++;
      while (i < lines.length && /^>/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      out += '<div class="callout callout-' + esc(kind) + '"><div class="ct">' + esc(title) + "</div>"
           + render(buf.join("\n"), ctx, base + at + 1) + "</div>";
      continue;
    }

    // blockquote
    if (/^>\s?/.test(line)){
      flush();
      const buf = [];
      const at = i;
      while (i < lines.length && /^>/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      out += "<blockquote>" + render(buf.join("\n"), ctx, base + at) + "</blockquote>";
      continue;
    }

    // table
    if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])){
      flush();
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(line);
      i += 2;
      let t = "<table><thead><tr>" + head.map(c => "<th>" + inline(c, ctx) + "</th>").join("") + "</tr></thead><tbody>";
      while (i < lines.length && /^\s*\|/.test(lines[i])){
        t += "<tr>" + cells(lines[i++]).map(c => "<td>" + inline(c, ctx) + "</td>").join("") + "</tr>";
      }
      out += t + "</tbody></table>";
      continue;
    }

    // heading
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h){
      flush();
      const n = h[1].length;
      out += "<h" + n + ' id="L' + (base + i) + '">' + inline(h[2], ctx) + "</h" + n + ">";
      i++;
      continue;
    }

    // hr
    if (/^\s*(---|\*\*\*|___)\s*$/.test(line)){ flush(); out += "<hr>"; i++; continue; }

    // lists
    if (/^\s*([-*+]|\d+\.)\s+/.test(line)){
      flush();
      const ordered = /^\s*\d+\./.test(line);
      let l = "<" + (ordered ? "ol" : "ul") + ">";
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])){
        let item = lines[i++].replace(/^\s*([-*+]|\d+\.)\s+/, "");
        const task = item.match(/^\[([ xX])\]\s+(.*)$/);
        if (task){
          l += '<li class="task"><input type="checkbox" disabled'
             + (task[1].toLowerCase() === "x" ? " checked" : "") + ">"
             + inline(task[2], ctx) + "</li>";
        } else {
          l += "<li>" + inline(item, ctx) + "</li>";
        }
        // indented continuation
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(lines[i])){
          l = l.replace(/<\/li>$/, "<br>" + inline(lines[i++].trim(), ctx) + "</li>");
        }
      }
      out += l + "</" + (ordered ? "ol" : "ul") + ">";
      continue;
    }

    if (!line.trim()){ flush(); i++; continue; }
    para.push(line);
    i++;
  }
  flush();
  return out;
}

/* ============================== state ============================== */
let NOTES = [], IMAGES = {}, TARGETS = {}, TERMINAL_OK = false;
let current = null, dirty = false, saving = false;

const $ = id => document.getElementById(id);
const listEl = $("list"), edEl = $("ed"), viewEl = $("view");
const statusEl = $("status"), crumbEl = $("crumb"), saveBtn = $("saveBtn"), qEl = $("q");

function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({"X-Notes-Token": TOKEN}, opts.headers || {});
  if (opts.body) opts.headers["Content-Type"] = "application/json";
  return fetch(path, opts).then(async r => {
    const j = await r.json().catch(() => ({ok:false, error:"bad response from server"}));
    if (!r.ok || j.ok === false) throw new Error(j.error || ("HTTP " + r.status));
    return j;
  });
}

function buildTargets(){
  TARGETS = {};
  for (const n of NOTES){
    const stem = n.path.split("/").pop().replace(/\.md$/, "");
    if (!(stem in TARGETS)) TARGETS[stem] = n.path;
    if (!(n.title in TARGETS)) TARGETS[n.title] = n.path;
  }
}
const ctx = () => ({images: IMAGES, targets: TARGETS});

function setStatus(text, cls){
  statusEl.textContent = text;
  statusEl.className = cls || "";
}

function setDirty(v){
  dirty = v;
  saveBtn.disabled = !v || saving;
  if (v) setStatus("unsaved changes", "dirty");
  drawList(qEl.value);
}

/* ------------------------------ the tree ------------------------------ */
/* Folders come out of the note paths themselves; there is no separate listing
   of directories, so a folder with no notes in it simply isn't there. Which
   folders are shut is remembered per vault, and a search ignores the memory —
   a match three folders down is no use behind a closed one.                */

let SHUT = new Set();
try { SHUT = new Set(JSON.parse(localStorage.getItem("notes-shut") || "[]")); }
catch (e) {}

function rememberShut(){
  try { localStorage.setItem("notes-shut", JSON.stringify([...SHUT])); } catch (e) {}
}

function treeOf(notes){
  const root = {dirs: new Map(), notes: [], count: 0};
  for (const n of notes){
    const parts = n.path.split("/");
    let node = root, here = "";
    node.count++;
    for (let k = 0; k < parts.length - 1; k++){
      here = here ? here + "/" + parts[k] : parts[k];
      if (!node.dirs.has(parts[k]))
        node.dirs.set(parts[k], {dirs: new Map(), notes: [], count: 0, path: here});
      node = node.dirs.get(parts[k]);
      node.count++;
    }
    node.notes.push(n);
  }
  return root;
}

function row(depth, cls){
  const b = document.createElement("button");
  b.className = "row " + cls;
  b.style.paddingLeft = (9 + depth * 13) + "px";
  return b;
}

function span(parent, cls, text){
  const el = document.createElement("span");
  el.className = cls;
  el.textContent = text;
  parent.appendChild(el);
  return el;
}

function drawBranch(node, depth, into, forceOpen){
  for (const [name, kid] of node.dirs){
    const shut = !forceOpen && SHUT.has(kid.path);
    const b = row(depth, "dir" + (shut ? " shut" : ""));
    b.dataset.fold = kid.path;
    span(b, "tw", "▼");
    span(b, "nm", name);
    span(b, "ct", kid.count);
    into.appendChild(b);
    if (!shut) drawBranch(kid, depth + 1, into, forceOpen);
  }
  for (const n of node.notes){
    const on = current && n.path === current.path;
    const b = row(depth, "note" + (on ? " on" : ""));
    b.dataset.open = n.path;
    b.title = n.path;
    span(b, "tw", "");                      /* keeps titles off the twisty column */
    span(b, "nm", n.title);
    if (on && dirty) span(b, "mk", "●");
    into.appendChild(b);
  }
}

function drawList(filter){
  const f = (filter || "").trim().toLowerCase();
  const shown = f ? NOTES.filter(n =>
    (n.title + " " + n.path + " " + n.tags.join(" ") + " " + n.raw).toLowerCase().includes(f)) : NOTES;
  listEl.innerHTML = "";
  drawBranch(treeOf(shown), 0, listEl, !!f);
  $("tally").textContent = f ? shown.length + "/" + NOTES.length : NOTES.length + " notes";
  if (f && !shown.length){
    const g = document.createElement("div");
    g.className = "grp"; g.textContent = "no matches";
    listEl.appendChild(g);
  }
}

/* Opening a note from a wikilink or from search can land inside a folder that
   is shut, which would leave nothing highlighted anywhere. */
function reveal(path){
  const parts = path.split("/");
  let here = "", changed = false;
  for (let k = 0; k < parts.length - 1; k++){
    here = here ? here + "/" + parts[k] : parts[k];
    if (SHUT.delete(here)) changed = true;
  }
  if (changed) rememberShut();
}

/* ----------------------------- the outline ----------------------------- */
/* Built from the text in the textarea, not from the rendered HTML, so it keeps
   up as you type and knows the source line of everything it lists. The line is
   the whole trick: the renderer puts the same number in an id, so one outline
   entry can move the preview and the caret to the same place.               */

let OUT_OFF = 0;                 /* body line 0 is this line of the file */

function linksIn(line, out, seen){
  /* Inline code is not a link, and an ![[embed]] is an image, not one either. */
  let t = line.replace(/`[^`]*`/g, " ").replace(/!\[\[[^\]]+\]\]/g, " ");
  const keep = (key, item) => { if (!seen.has(key)){ seen.add(key); out.push(item); } };

  t = t.replace(/\[\[([^\]]+)\]\]/g, (m, raw) => {
    const bar = raw.indexOf("|");
    const target = (bar < 0 ? raw : raw.slice(0, bar)).trim();
    const label  = (bar < 0 ? raw : raw.slice(bar + 1)).trim();
    keep("w:" + target, {kind: "wiki", target: target, label: label || target});
    return " ";
  });
  t = t.replace(/\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, (m, label, href) => {
    keep("u:" + href, {kind: "url", href: href, label: label.trim() || href});
    return " ";
  });
  t.replace(/(^|[\s(])(https?:\/\/[^\s<>)"']+[^\s<>)"'.,;:!?])/g, (m, pre, href) => {
    keep("u:" + href, {kind: "url", href: href, label: href});
    return m;
  });
}

function plain(s){
  return s.replace(/`([^`]*)`/g, "$1")
          .replace(/\[\[([^\]|]+)(?:\|([^\]]*))?\]\]/g, (m, a, b) => b || a)
          .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
          .replace(/[*_~]/g, "")
          .trim();
}

function outlineOf(text){
  const [fm, body] = splitFm(text);
  /* Line numbers in the outline are body-relative, because that is what the
     renderer counts. The textarea holds the frontmatter too. */
  const off = fm === null ? 0 : fm.split("\n").length + 2;
  const lines = body.split("\n");
  const items = [], links = [], seen = new Set();
  let i = 0;

  while (i < lines.length){
    const fence = lines[i].match(/^```(\S*)/);
    if (fence){
      const at = i, lang = (fence[1] || "").toLowerCase();
      const buf = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      /* The first line that says anything is what a code block is "called" —
         a bare fence has no other label, and a URL in a command is not a link
         anyone can follow from here. */
      const first = (buf.find(l => l.trim()) || "").trim();
      items.push({kind: "code", line: at, lang: lang,
                  text: first.slice(0, 120) || lang || "code block"});
      continue;
    }
    const h = lines[i].match(/^(#{1,6})\s+(.*)$/);
    if (h) items.push({kind: "h", line: i, level: h[1].length, text: plain(h[2])});
    linksIn(lines[i], links, seen);
    i++;
  }
  return {items: items, links: links, off: off};
}

function host(href){
  try { return new URL(href).hostname.replace(/^www\./, ""); }
  catch (e) { return ""; }
}

function drawOutline(){
  const box = $("outBody");
  box.innerHTML = "";
  if (!current){
    box.innerHTML = '<div class="none">No note open.</div>';
    $("outTally").textContent = "";
    return;
  }
  const o = outlineOf(edEl.value);
  OUT_OFF = o.off;

  for (const it of o.items){
    const b = document.createElement("button");
    b.dataset.line = it.line;
    if (it.kind === "h"){
      b.className = "o h" + it.level;
      span(b, "nm", it.text || "untitled heading");
    } else {
      b.className = "o code";
      if (it.lang) span(b, "tag", it.lang);
      span(b, "nm", it.text);
    }
    b.title = it.text;
    box.appendChild(b);
  }
  if (!o.items.length)
    box.innerHTML = '<div class="none">No headings or code blocks yet.</div>';

  if (o.links.length){
    const head = document.createElement("div");
    head.className = "osec";
    head.textContent = "Links";
    box.appendChild(head);
    for (const l of o.links){
      if (l.kind === "wiki"){
        const path = TARGETS[l.target];
        const b = document.createElement("button");
        b.className = "o link" + (path ? "" : " dead");
        if (path){ b.dataset.open = path; b.title = path; }
        else b.title = "no note called that";
        span(b, "nm", l.label);
        span(b, "host", "note");
        box.appendChild(b);
      } else {
        const a = document.createElement("a");
        a.className = "o link";
        a.href = l.href; a.target = "_blank"; a.rel = "noopener noreferrer";
        a.title = l.href;
        span(a, "nm", l.label);
        span(a, "host", host(l.href));
        box.appendChild(a);
      }
    }
  }
  $("outTally").textContent = o.items.length + " item" + (o.items.length === 1 ? "" : "s")
    + (o.links.length ? " · " + o.links.length + " link" + (o.links.length === 1 ? "" : "s") : "");
  spy();
}

function caretTo(fileLine){
  const upto = edEl.value.split("\n").slice(0, fileLine);
  const pos = upto.join("\n").length + (upto.length ? 1 : 0);
  edEl.focus();
  edEl.setSelectionRange(pos, pos);
  /* Setting the selection on a textarea that is already focused does not
     scroll it, and line × line-height is wrong the moment a line wraps.
     Leaving and coming back makes the browser scroll its own caret in. */
  edEl.blur();
  edEl.focus();
}

function gotoLine(line){
  const mode = document.body.className;
  if (mode === "mode-live"){
    /* One place to go rather than two: the block holding that line opens for
       editing, which is what the outline is pointing at. */
    const file = line + OUT_OFF;
    const i = LIVE.findIndex(b => file >= b.a && file < b.b);
    if (i >= 0){
      activate(i, 0);
      const ta = liveEl.querySelector("textarea.raw");
      if (ta) ta.scrollIntoView({block: "center"});
    }
    mark(line);
    spyHold = Date.now() + 700;
    return;
  }
  /* The caret first. Focusing the textarea scrolls it, and a browser treats
     that as the user taking over — it cancels a smooth scroll already running
     in the preview, which left the preview short of where it was going. */
  if (mode !== "mode-view") caretTo(line + OUT_OFF);
  const el = document.getElementById("L" + line);
  if (el && mode !== "mode-edit")
    el.scrollIntoView({block: "start", behavior: "smooth"});
  /* Near the end of a note there is not enough left to scroll, so the target
     cannot reach the top and the scroll-spy would rightly say the current
     section is still the one above it. What you clicked is the answer you
     want back, so it wins until you scroll for yourself. */
  mark(line);
  spyHold = Date.now() + 700;
}

function mark(line){
  for (const b of $("outBody").querySelectorAll(".here")) b.classList.remove("here");
  const b = $("outBody").querySelector('[data-line="' + line + '"]');
  if (b) b.classList.add("here");
}

/* Which entry the preview is currently sitting on. rAF-throttled: this runs
   on every scroll event and reads layout for each entry. */
let spying = false, spyHold = 0;
function spy(){
  if (spying || Date.now() < spyHold) return;
  spying = true;
  requestAnimationFrame(() => {
    spying = false;
    const wrap = $("viewWrap").offsetParent ? $("viewWrap") : $("liveWrap");
    if (!wrap.offsetParent) return;             /* neither is on screen */
    const line = wrap.getBoundingClientRect().top + 48;
    let hit = null;
    for (const b of $("outBody").querySelectorAll("button[data-line]")){
      const el = document.getElementById("L" + b.dataset.line);
      if (!el) continue;
      if (el.getBoundingClientRect().top <= line) hit = b; else break;
    }
    for (const b of $("outBody").querySelectorAll(".here")) b.classList.remove("here");
    if (hit) hit.classList.add("here");
  });
}

/* ------------------------------ live mode ------------------------------ */
/* The note reads as the preview does, except for the block the caret is in:
   that one is a textarea holding its own markdown. Two things make it work
   without a second copy of anything. The blocks are cut on the same rules the
   renderer uses, so a rendered block and its source are the same lines. And
   the textarea in #ed stays the one true text — the inline editor splices its
   own lines back into it on every keystroke, so saving, the outline, the
   conflict check and Ctrl-S all carry on reading the note they always did.

   Block, not line: a paragraph is three lines that render as one thing, and
   there is no half-rendered paragraph to put a raw line inside. List items
   are cut one per block, though, because a whole list going raw to fix one
   bullet is exactly the jolt this mode exists to avoid. */

const liveEl = $("live");
let LIVE = [];                 /* the blocks, in file line numbers */
let LIVE_AT = null;            /* which one is open, if any */

const LIST = /^\s*([-*+]|\d+\.)\s+/;
const HEAD = /^(#{1,6})\s+/;
const RULE = /^\s*(---|\*\*\*|___)\s*$/;

function blocksOf(text){
  const lines = text.split("\n");
  const out = [];
  let i = 0;

  /* Frontmatter is one block whatever is in it: one thing to read, one to
     edit. It is also the one block the renderer would misread on its own —
     handed a slice with no trailing newline, splitFm sees two rules and a
     paragraph — so drawLive() writes it out itself. */
  if (lines[0] === "---"){
    let k = 1;
    while (k < lines.length && lines[k] !== "---") k++;
    if (k < lines.length){ out.push({a: 0, b: k + 1, kind: "fm"}); i = k + 1; }
  }

  while (i < lines.length){
    const line = lines[i];
    if (!line.trim()){ i++; continue; }      /* blank lines belong to no block */
    const a = i;

    if (/^```/.test(line)){
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) i++;
      out.push({a: a, b: Math.min(i + 1, lines.length), kind: "code"});
      i++;
      continue;
    }
    if (/^>/.test(line)){                    /* blockquotes and callouts alike */
      while (i < lines.length && /^>/.test(lines[i])) i++;
      out.push({a: a, b: i, kind: "quote"});
      continue;
    }
    if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])){
      i += 2;
      while (i < lines.length && /^\s*\|/.test(lines[i])) i++;
      out.push({a: a, b: i, kind: "table"});
      continue;
    }
    if (HEAD.test(line)){
      out.push({a: a, b: a + 1, kind: "h" + line.match(HEAD)[1].length});
      i++;
      continue;
    }
    if (RULE.test(line)){ out.push({a: a, b: a + 1, kind: "hr"}); i++; continue; }
    if (LIST.test(line)){
      const ordered = /^\s*\d+\./.test(line);
      i++;
      while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !LIST.test(lines[i])) i++;
      out.push({a: a, b: i, kind: "li", ordered: ordered});
      continue;
    }
    while (i < lines.length && lines[i].trim() && !/^```/.test(lines[i])
           && !/^>/.test(lines[i]) && !HEAD.test(lines[i])
           && !LIST.test(lines[i]) && !RULE.test(lines[i])) i++;
    out.push({a: a, b: i, kind: "p"});
  }

  /* An empty note has no blocks and so nothing to click on. Give it one. */
  if (!out.length) out.push({a: Math.max(0, lines.length - 1), b: lines.length, kind: "p"});
  return out;
}

function grow(ta){
  ta.style.height = "auto";
  ta.style.height = ta.scrollHeight + "px";
}

function drawLive(){
  liveEl.innerHTML = "";
  if (!current) return;
  LIVE = blocksOf(edEl.value);
  if (LIVE_AT !== null && LIVE_AT >= LIVE.length) LIVE_AT = null;
  const lines = edEl.value.split("\n");
  const c = ctx();
  let ordinal = 0;

  LIVE.forEach((blk, i) => {
    const text = lines.slice(blk.a, blk.b).join("\n");
    const runs = blk.kind === "li";
    const before = runs && i > 0 && LIVE[i - 1].kind === "li";
    const after  = runs && i + 1 < LIVE.length && LIVE[i + 1].kind === "li";
    /* Numbering restarts where the numbers do. Bullets sitting above an
       ordered list are part of the same run for spacing and no part of it
       for counting. */
    ordinal = blk.ordered ? (before && LIVE[i - 1].ordered ? ordinal + 1 : 1) : 0;

    if (i === LIVE_AT){
      const ta = document.createElement("textarea");
      ta.className = "raw" + (blk.kind === "p" ? "" : " " + blk.kind);
      ta.spellcheck = false;
      ta.value = text;
      liveEl.appendChild(ta);
      grow(ta);
      return;
    }

    const div = document.createElement("div");
    div.className = "blk";
    div.dataset.i = i;
    if (runs) div.dataset.run = before && after ? "mid" : before ? "end" : after ? "start" : "solo";

    if (!text.trim()){
      div.innerHTML = '<p class="hint">This note is empty — click here to start writing.</p>';
    } else if (blk.kind === "fm"){
      div.innerHTML = '<div class="fm">' + esc(text.replace(/^---\n?/, "").replace(/\n?---$/, "").trim()) + "</div>";
    } else {
      div.innerHTML = render(text, c, blk.a);
      /* Every item is its own one-item list, so an <ol> would start over at 1
         each time. The number comes from where the item sits in its run. */
      if (blk.ordered){
        const ol = div.querySelector("ol");
        if (ol) ol.start = ordinal;
      }
    }
    liveEl.appendChild(div);
  });
}

/* Where in the raw markdown a click on the rendered text landed.

   The two strings differ by exactly the markup, so walking them together and
   skipping what produced no visible character gets there. It is an
   approximation — a click inside a wikilink's own brackets can land a
   character or two out — and it only has to put the caret near enough that
   the next thing you do is type, not hunt. */
function rawOffset(raw, want){
  if (want == null) return raw.length;
  if (want <= 0) return 0;
  let i = 0, seen = 0, bol = true;
  while (i < raw.length && seen < want){
    const rest = raw.slice(i);
    if (bol){
      bol = false;
      const lead = rest.match(/^(\s*(?:[-*+]|\d+\.)\s+(?:\[[ xX]\]\s+)?|#{1,6}\s+|>\s?|```\S*|\|)/);
      if (lead){ i += lead[0].length; continue; }
    }
    if (raw[i] === "\n"){ i++; bol = true; continue; }   /* a <br> is no character */

    const mark = rest.match(/^(\*\*|~~|`|\*)/);
    if (mark){ i += mark[0].length; continue; }

    const wiki = rest.match(/^\[\[([^\]|]*)(?:\|([^\]]*))?\]\]/);
    if (wiki){
      const shown = wiki[2] != null ? wiki[2] : wiki[1];
      const head = wiki[2] != null ? 3 + wiki[1].length : 2;
      const take = Math.min(shown.length, want - seen);
      seen += take;
      i += head + take;
      if (seen >= want) return i;
      i += (shown.length - take) + 2;
      continue;
    }
    const link = rest.match(/^\[([^\]]*)\]\([^)]*\)/);
    if (link){
      const take = Math.min(link[1].length, want - seen);
      seen += take;
      i += 1 + take;
      if (seen >= want) return i;
      i += (link[1].length - take) + (link[0].length - link[1].length - 1);
      continue;
    }
    i++;
    seen++;
  }
  return i;
}

/* How far into the block's rendered text a point is. */
function pointOffset(el, x, y){
  let node = null, at = 0;
  if (document.caretRangeFromPoint){
    const r = document.caretRangeFromPoint(x, y);
    if (r){ node = r.startContainer; at = r.startOffset; }
  } else if (document.caretPositionFromPoint){
    const r = document.caretPositionFromPoint(x, y);
    if (r){ node = r.offsetNode; at = r.offset; }
  }
  if (!node || node.nodeType !== 3 || !el.contains(node)) return null;
  let seen = 0;
  const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let t;
  while ((t = walk.nextNode())){
    if (t === node) return seen + at;
    seen += t.nodeValue.length;
  }
  return null;
}

function blockText(i){
  const lines = edEl.value.split("\n");
  return lines.slice(LIVE[i].a, LIVE[i].b).join("\n");
}

function activate(i, at){
  if (i == null || i < 0 || i >= LIVE.length) return;
  LIVE_AT = i;
  drawLive();
  const ta = liveEl.querySelector("textarea.raw");
  if (!ta) return;
  ta.focus();
  const pos = Math.max(0, Math.min(at == null ? ta.value.length : at, ta.value.length));
  ta.setSelectionRange(pos, pos);
}

function deactivate(){
  if (LIVE_AT === null) return;
  LIVE_AT = null;
  drawLive();
}

/* Splice the block being edited back into the note. Everything below it moves
   by however many lines it just gained or lost. */
function liveEdit(ta){
  const blk = LIVE[LIVE_AT];
  if (!blk) return;
  const lines = edEl.value.split("\n");
  const mine = ta.value.split("\n");
  edEl.value = lines.slice(0, blk.a).concat(mine, lines.slice(blk.b)).join("\n");
  const delta = (blk.a + mine.length) - blk.b;
  blk.b += delta;
  for (let j = LIVE_AT + 1; j < LIVE.length; j++){ LIVE[j].a += delta; LIVE[j].b += delta; }
  grow(ta);
  if (!dirty) setDirty(true);
  drawOutline();
}

liveEl.addEventListener("mousedown", e => {
  if (e.target.closest("textarea.raw")) return;      /* it already has the caret */
  if (e.target.closest("a[href]")) return;           /* a real link is a link */
  const div = e.target.closest(".blk");
  if (!div) return;
  /* Taking the default stops the browser moving focus for us, which is the
     whole trick: no blur fires, so the block we are leaving does not redraw
     out from under the click that is choosing the next one. */
  e.preventDefault();
  const i = +div.dataset.i;
  activate(i, rawOffset(blockText(i), pointOffset(div, e.clientX, e.clientY)));
});

liveEl.addEventListener("click", e => {
  const a = e.target.closest("a.wl[data-open]");
  if (a){ e.preventDefault(); return open_(a.dataset.open); }
  const b = e.target.closest("button[data-cb]");
  if (b) codeAction(b);
});

liveEl.addEventListener("input", e => {
  if (e.target.classList.contains("raw")) liveEdit(e.target);
});

liveEl.addEventListener("focusout", e => {
  if (!e.target.classList.contains("raw")) return;
  /* Only when the focus actually left the pane — inside it, mousedown above
     has already chosen the next block. */
  setTimeout(() => {
    if (LIVE_AT !== null && !liveEl.contains(document.activeElement)) deactivate();
  }, 0);
});

liveEl.addEventListener("keydown", e => {
  const ta = e.target;
  if (!ta.classList || !ta.classList.contains("raw")) return;
  if (e.key === "Escape"){ e.preventDefault(); return deactivate(); }
  if (e.key === "Tab"){
    e.preventDefault();
    const s = ta.selectionStart, t = ta.selectionEnd;
    ta.value = ta.value.slice(0, s) + "  " + ta.value.slice(t);
    ta.setSelectionRange(s + 2, s + 2);
    return liveEdit(ta);
  }
  /* Off the top or the bottom of a block and into the next one, so the caret
     walks the note the way it would in a plain editor. */
  const before = ta.value.slice(0, ta.selectionStart);
  if (e.key === "ArrowUp" && !before.includes("\n")){
    e.preventDefault();
    return activate(LIVE_AT - 1, null);
  }
  if (e.key === "ArrowDown" && !ta.value.slice(ta.selectionEnd).includes("\n")){
    e.preventDefault();
    return activate(LIVE_AT + 1, 0);
  }
});

function preview(){
  /* One rendered tree at a time. Headings and code blocks carry an id naming
     their source line, and two copies of the note would mean two elements
     claiming the same id — after which nothing that scrolls to one works. */
  if (document.body.classList.contains("mode-live")){
    viewEl.innerHTML = "";
    drawLive();
  } else {
    liveEl.innerHTML = "";
    LIVE_AT = null;
    viewEl.innerHTML = render(edEl.value, ctx());
  }
  drawOutline();
}

function open_(path){
  if (dirty && !confirm("You have unsaved changes. Discard them?")) return;
  const n = NOTES.find(x => x.path === path);
  if (!n) return;
  current = n;
  edEl.value = n.raw;
  crumbEl.textContent = n.path;
  preview();
  $("viewWrap").scrollTop = 0;
  $("liveWrap").scrollTop = 0;
  edEl.scrollTop = 0;
  setDirty(false);
  setStatus("", "");
  document.title = n.title + " — Notes";
  $("trashBtn").disabled = false;
  reveal(n.path);
  drawList(qEl.value);
}

async function save(){
  if (!current || !dirty || saving) return;
  saving = true; saveBtn.disabled = true;
  setStatus("saving…", "");
  try{
    const r = await api("/api/note", {
      method: "PUT",
      body: JSON.stringify({path: current.path, content: edEl.value, mtime: current.mtime})
    });
    current.raw = r.content;
    current.mtime = r.mtime;
    if (edEl.value !== r.content){        // server refreshed `updated:`
      const at = edEl.selectionStart;
      edEl.value = r.content;
      edEl.setSelectionRange(at, at);
    }
    const meta = splitFm(r.content)[0] || "";
    const t = meta.match(/^title:\s*(.+)$/m);
    if (t) current.title = t[1].trim();
    saving = false;
    setDirty(false);
    setStatus("saved" + (r.backup ? " · previous kept in .backups/" : ""), "saved");
    preview();
    setTimeout(() => { if (!dirty) setStatus("", ""); }, 4000);
  } catch (e){
    saving = false;
    saveBtn.disabled = false;
    setStatus(e.message, "error");
    if (/changed on disk/.test(e.message)){
      alert("This note changed on disk since you opened it — probably edited in another "
          + "program.\n\nYour text here has NOT been saved. Copy anything you want to keep, "
          + "then reload the page to pick up the version on disk.");
    }
  }
}

/* ---------------------------- dialog ---------------------------- */
let dlgMode = "new";
function openDialog(){
  dlgMode = "new";
  const folders = [...new Set(NOTES.map(n => n.folder))].sort();
  $("dlgFolder").innerHTML = folders
    .map(f => '<option value="' + esc(f) + '">' + esc(f === "(root)" ? "Vault root" : f) + "</option>")
    .join("");
  if (current) $("dlgFolder").value = current.folder;
  $("dlgName").value = "";
  $("dlgErr").textContent = "";
  $("veil").classList.add("open");
  $("dlgName").focus();
}
function closeDialog(){ $("veil").classList.remove("open"); }

async function createNote(){
  const title = $("dlgName").value.trim();
  if (!title){ $("dlgErr").textContent = "Give it a title."; return; }
  if (/[\/\\:*?"<>|]/.test(title)){ $("dlgErr").textContent = "Avoid / \\ : * ? \" < > | in the title."; return; }
  const folder = $("dlgFolder").value;
  const path = (folder === "(root)" ? "" : folder + "/") + title + ".md";
  try{
    const r = await api("/api/new", {method: "POST", body: JSON.stringify({path, title})});
    await reload();
    closeDialog();
    open_(r.path);
    edEl.focus();
    edEl.setSelectionRange(edEl.value.length, edEl.value.length);
  } catch (e){
    $("dlgErr").textContent = e.message;
  }
}

async function trashNote(){
  if (!current) return;
  if (!confirm('Move "' + current.title + '" to .trash/?\n\nThe file is moved, not deleted — '
             + "you can pull it back out of that folder.")) return;
  try{
    const r = await api("/api/trash", {method: "POST", body: JSON.stringify({path: current.path})});
    const gone = current.path;
    current = null; dirty = false;
    edEl.value = ""; viewEl.innerHTML = ""; crumbEl.textContent = "";
    await reload();
    setStatus("moved to " + r.trashed, "saved");
    $("trashBtn").disabled = true;
    if (NOTES.length) open_(NOTES[0].path);
  } catch (e){ setStatus(e.message, "error"); }
}

/* ----------------------------- the footer ----------------------------- */
/* Three things move these notes around: whatever the sync command does, the
   provider folder the vault sits in, and git. The footer is a window on all
   three and a control for none of them — the only button that acts is the one
   that was already here, and git is read with --no-optional-locks so that
   looking cannot collide with a git command in a terminal.                 */

const syncBtn = $("syncBtn"), consoleEl = $("console");
let SYNC = null, GIT = null, CLOUD = null;

function rel(t){
  const delta = t * 1000 - Date.now(), ahead = delta > 0;
  const s = Math.abs(delta) / 1000;
  let n, unit;
  if (s < 45)         { return ahead ? "in a moment" : "just now"; }
  else if (s < 3600)  { n = Math.round(s / 60);    unit = "minute"; }
  else if (s < 86400) { n = Math.round(s / 3600);  unit = "hour"; }
  else                { n = Math.round(s / 86400); unit = "day"; }
  const phrase = n + " " + unit + (n === 1 ? "" : "s");
  return ahead ? "in " + phrase : phrase + " ago";
}

function chip(el, dot, parts, title){
  el.innerHTML = '<span class="dot ' + dot + '"></span>'
               + parts.filter(Boolean).join('<span class="sep"> · </span>');
  el.title = title || "";
  el.hidden = false;
}

function drawCloud(){
  const c = CLOUD, el = $("cloudChip");
  if (!c || !c.detected){
    return chip(el, "", ["Not in a sync folder"],
      "cairn looks at the vault's path for a provider's folder — Proton Drive, "
      + "iCloud or Dropbox. This vault is not inside one, so nothing off this "
      + "machine has a copy unless git is pushing somewhere.");
  }
  /* The newest note on disk, from the listing the page already has. It is the
     honest half of this chip: cairn can see when a file last changed, and
     cannot see whether the provider has finished uploading it. */
  const newest = NOTES.reduce((m, n) => Math.max(m, n.mtime || 0), 0);
  chip(el, c.present ? "ok" : "bad",
       ["<b>" + esc(c.provider) + "</b>",
        c.account ? esc(c.account) : null,
        c.present ? (newest ? "note saved " + esc(rel(newest)) : "no notes yet")
                  : '<span class="bad">folder is not there</span>'],
       c.present
         ? "The vault is inside " + c.root + ".\n\ncairn can see that folder and "
           + "when its files last changed. It cannot see " + c.provider + "'s "
           + "upload queue, so this does not promise the last save has reached "
           + "the cloud."
         : c.root + " is not readable right now — the client may be signed out "
           + "or not running.");
}

function drawGit(){
  const g = GIT, el = $("gitChip");
  if (!g || !g.repo)
    return chip(el, "", ["Not a git repo"],
                "No git repository at or above the vault.");
  const bits = [];
  bits.push("<b>" + esc(g.detached ? "detached HEAD" : (g.branch || "?")) + "</b>");

  const work = [];
  if (g.changed)   work.push(g.changed + " changed");
  if (g.untracked) work.push(g.untracked + " new");
  bits.push(work.length ? work.join(", ") : "clean");

  if (g.upstream && (g.ahead || g.behind)){
    const d = [];
    if (g.ahead)  d.push("↑" + g.ahead);
    if (g.behind) d.push("↓" + g.behind);
    bits.push(d.join(" "));
  }
  if (g.last) bits.push("committed " + esc(rel(g.last.at)));

  /* Amber for anything that is only on this machine — uncommitted work, or
     commits that have not been pushed. Red is reserved for a failure. */
  const dot = (!g.clean || g.ahead) ? "warn" : "ok";
  const lines = [g.root];
  if (g.upstream) lines.push("tracking " + g.upstream);
  else lines.push("no upstream branch — nothing to push to");
  if (g.last) lines.push(g.last.short + "  " + g.last.subject);
  lines.push("Read-only: cairn never stages, commits or pushes.");
  chip(el, dot, bits, lines.join("\n"));
}

function drawSync(){
  const s = SYNC, el = $("syncChip");
  if (!s || !s.enabled){
    el.hidden = true;
    syncBtn.hidden = true;
    return;
  }
  syncBtn.hidden = false;
  syncBtn.disabled = !!s.running;
  syncBtn.textContent = s.running ? "Syncing…" : "Sync now";

  if (s.running) return chip(el, "run", ["<b>Syncing…</b>"], "The sync command is running.");

  /* A run started by the timer never passes through cairn, so its time comes
     from systemd and the button's own runs come from the state file. Whichever
     is more recent is the one that actually touched the notes. */
  const mine = s.last && s.last.at, theirs = s.timer_last;
  const last = Math.max(mine || 0, theirs || 0) || null;
  const failed = s.last && !s.last.ok && mine && mine >= (theirs || 0);

  chip(el, failed ? "bad" : (last ? "ok" : ""),
       [last ? "Synced <b>" + esc(rel(last)) + "</b>"
                + (failed ? ' <span class="bad">— failed</span>' : "")
             : "No sync yet",
        s.next ? "next <b>" + esc(rel(s.next)) + "</b>" : null],
       failed && s.last.output ? s.last.output.trim().split("\n").slice(-6).join("\n") : "");
}

function drawFoot(){
  drawCloud();
  drawGit();
  drawSync();
}

function drawVersion(v){
  /* The server's number, not one written down twice in two files. Until the
     first status call answers, the footer just says the name. */
  $("ver").textContent = v ? "cairn " + v : "cairn";
  $("ver").title = "cairn" + (v ? " " + v : "")
                 + " — a small browser editor for a folder of markdown notes";
}

async function refreshStatus(){
  try {
    const r = await api("/api/status");
    SYNC = r.sync; GIT = r.git; CLOUD = r.cloud;
    drawVersion(r.version);
  } catch (e){
    SYNC = GIT = CLOUD = null;               /* server too old, or not unlocked */
  }
  drawFoot();
  /* A sync the timer started is nobody's click, so this is where the activity
     panel finds out there is something to follow. */
  if (SYNC && SYNC.running) scheduleLog(0);
}

/* ---------------------------- activity panel ---------------------------- */
/* Every line cairn has run, asked for by sequence number so an open panel
   costs one small response per poll however long the script has been talking. */

let LOG_SEQ = 0, LOG_EMPTY = true, logSoon = null;

function clock(t){
  const d = new Date(t * 1000);
  return String(d.getHours()).padStart(2, "0") + ":"
       + String(d.getMinutes()).padStart(2, "0") + ":"
       + String(d.getSeconds()).padStart(2, "0");
}

function addLines(lines){
  if (!lines.length) return;
  if (LOG_EMPTY){ consoleEl.innerHTML = ""; LOG_EMPTY = false; }
  /* Follow the tail only for someone who is already at it — scrolling back to
     read an error should not be yanked away by the next line. */
  const stuck = consoleEl.scrollTop + consoleEl.clientHeight >= consoleEl.scrollHeight - 24;
  for (const l of lines){
    const d = document.createElement("div");
    d.className = "ln " + (l.kind || "out");
    span(d, "t", clock(l.at));
    span(d, "m", l.text || "");
    consoleEl.appendChild(d);
  }
  while (consoleEl.children.length > 600) consoleEl.firstChild.remove();
  if (stuck) consoleEl.scrollTop = consoleEl.scrollHeight;
}

async function logTick(){
  let running = false;
  try {
    const r = await api("/api/run/log?since=" + LOG_SEQ);
    LOG_SEQ = r.seq;
    addLines(r.lines);
    running = r.running;
  } catch (e){ /* the next poll can try again */ }
  consoleBtn.classList.toggle("busy", running);
  /* Follow a run closely; idle, only often enough that a panel left open
     notices a timer-driven sync. Closed and idle: stop asking. */
  if (running) scheduleLog(900);
  else if (document.body.dataset.console === "on") scheduleLog(6000);
}

function scheduleLog(ms){
  clearTimeout(logSoon);
  logSoon = setTimeout(logTick, ms);
}

async function doSync(){
  /* A sync rewrites notes on disk. Anything unsaved in the textarea would be
     silently outrun by it, so make the user deal with that first.          */
  if (dirty){
    setStatus("save or discard your changes first — a sync can overwrite this note", "error");
    return;
  }
  syncBtn.disabled = true;
  syncBtn.textContent = "Syncing…";
  setStatus("syncing…");
  panel("console", true);                    /* the point of pressing it */
  scheduleLog(0);
  try {
    const record = (await api("/api/sync", {method: "POST"})).sync;
    /* The notes on disk may have changed underneath us, including the open
       one. Not dirty, so reopening it cannot lose anything.                */
    const was = current && current.path;
    await reload();
    if (was) open_(was);
    /* After the reopen, never before: open_ clears the status line, which
       would swallow the message this whole function exists to deliver.     */
    if (record.ok){
      setStatus("sync finished in " + record.seconds + "s", "saved");
    } else {
      /* The exit code alone tells the user nothing. The script's last line is
         usually the reason it stopped, and the activity panel above has the
         rest of it.                                                        */
      const lines = (record.output || "").trim().split("\n").filter(l => l.trim());
      const why = lines.length ? lines[lines.length - 1].slice(0, 140) : "";
      setStatus("sync failed" + (record.code == null ? "" : " (exit " + record.code + ")")
                + (why ? " — " + why : ""), "error");
    }
  } catch (e){
    setStatus(e.message, "error");
  }
  scheduleLog(0);
  await refreshStatus();
}

/* ------------------------------- panels ------------------------------- */
/* Attributes rather than classes, because the Edit/Split/Preview buttons
   assign body.className outright and would drop anything kept there. */

const PANELS = {left: $("leftBtn"), right: $("rightBtn"), console: $("consoleBtn")};
const consoleBtn = PANELS.console;

function panel(which, on){
  document.body.dataset[which] = on ? "on" : "off";
  PANELS[which].classList.toggle("on", on);
  try { localStorage.setItem("notes-panel-" + which, on ? "on" : "off"); } catch (e) {}
  if (which === "console" && on){
    LOG_EMPTY = consoleEl.children.length === 0 || !!consoleEl.querySelector(".idle");
    scheduleLog(0);
  }
  /* Narrow enough that a panel covers the note rather than sitting beside it:
     two of them at once would cover it twice over. */
  if (on && which !== "console" && window.innerWidth <= 900){
    const other = which === "left" ? "right" : "left";
    if (document.body.dataset[other] === "on") panel(other, false);
  }
  if (which !== "console") spy();            /* the preview just changed width */
}

function toggle(which){ panel(which, document.body.dataset[which] !== "on"); }

/* Ctrl-B, Ctrl-E and Ctrl-J are all real emacs bindings inside a text field on
   a Mac — back a character, end of line, newline — so there the shortcut is
   Command and nothing else. Save and New are Ctrl-S and Ctrl-N, which are not,
   and take either. */
const MAC = /Mac|iP(hone|ad|od)/.test(navigator.platform || navigator.userAgent);
const mod = e => MAC ? (e.metaKey && !e.ctrlKey) : (e.ctrlKey && !e.metaKey);

function restorePanels(){
  const wide = window.innerWidth > 900;
  for (const which of ["left", "right", "console"]){
    let want = null;
    try { want = localStorage.getItem("notes-panel-" + which); } catch (e) {}
    if (want === null) want = (which !== "console" && wide) ? "on" : "off";
    /* A phone that once opened a panel on a desktop-width window should still
       open on the note itself. */
    panel(which, want === "on" && (wide || which === "console"));
  }
}

/* ---------------------------- boot ---------------------------- */
async function reload(){
  const r = await api("/api/notes");
  NOTES = r.notes; IMAGES = r.images; TERMINAL_OK = !!r.terminal;
  buildTargets();
  if (current){
    const again = NOTES.find(n => n.path === current.path);
    current = again || null;
  }
  drawList(qEl.value);
}

/* ------------------------ code block buttons ------------------------ */
/* Reading the text back out of the DOM keeps the code block itself the single
   source of truth — no second, escaped copy in a data attribute to disagree. */
function codeText(btn){
  const pre = btn.closest(".cb").querySelector("code");
  return pre ? pre.textContent.replace(/\n$/, "") : "";
}

function flash(btn, label, cls){
  const was = btn.textContent;
  btn.textContent = label;
  btn.classList.add(cls);
  setTimeout(() => { btn.textContent = was; btn.classList.remove(cls); }, 1600);
}

async function copyText(text){
  // clipboard.writeText needs a secure context, which plain HTTP over the LAN
  // is not — and even where it exists the browser can still refuse the write,
  // so a rejection falls through to the old selection trick rather than out.
  if (navigator.clipboard && window.isSecureContext){
    try { return await navigator.clipboard.writeText(text); }
    catch (e) { /* fall through */ }
  }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  const ok = document.execCommand("copy");
  ta.remove();
  if (!ok) throw new Error("copy was refused by the browser");
}

async function codeAction(btn){
  const text = codeText(btn);
  // A second click while the last result is still showing would capture that
  // label as the button's "real" text and leave it stuck there.
  if (!text || btn.classList.contains("done") || btn.classList.contains("bad")) return;
  try{
    if (btn.dataset.cb === "copy"){
      await copyText(text);
      flash(btn, "copied", "done");
      setStatus("", "");                     // don't leave a stale error beside a success
    } else {
      const r = await api("/api/terminal", {
        method: "POST", body: JSON.stringify({command: text})
      });
      flash(btn, "opened", "done");
      setStatus("typed into " + r.terminal + " at " + r.cwd + " — not run", "saved");
    }
  } catch (e){
    flash(btn, "failed", "bad");
    setStatus(e.message, "error");
  }
}

listEl.addEventListener("click", e => {
  const f = e.target.closest("[data-fold]");
  if (f){
    if (SHUT.has(f.dataset.fold)) SHUT.delete(f.dataset.fold);
    else SHUT.add(f.dataset.fold);
    rememberShut();
    return drawList(qEl.value);
  }
  const b = e.target.closest("[data-open]");
  if (b) open_(b.dataset.open);
});

$("outBody").addEventListener("click", e => {
  const b = e.target.closest("[data-open]");
  if (b){ e.preventDefault(); return open_(b.dataset.open); }
  const j = e.target.closest("[data-line]");
  if (j) gotoLine(+j.dataset.line);
});
$("viewWrap").addEventListener("scroll", spy, {passive: true});
$("liveWrap").addEventListener("scroll", spy, {passive: true});
viewEl.addEventListener("click", e => {
  const a = e.target.closest("a.wl[data-open]");
  if (a){ e.preventDefault(); open_(a.dataset.open); }
  const b = e.target.closest("button[data-cb]");
  if (b) codeAction(b);
});

edEl.addEventListener("input", () => { if (!dirty) setDirty(true); preview(); });
edEl.addEventListener("keydown", e => {
  if (e.key === "Tab"){
    e.preventDefault();
    const s = edEl.selectionStart, t = edEl.selectionEnd;
    edEl.value = edEl.value.slice(0, s) + "  " + edEl.value.slice(t);
    edEl.setSelectionRange(s + 2, s + 2);
    if (!dirty) setDirty(true);
    preview();
  }
});
qEl.addEventListener("input", () => drawList(qEl.value));
saveBtn.addEventListener("click", save);
syncBtn.addEventListener("click", doSync);
$("leftBtn").addEventListener("click", () => toggle("left"));
$("rightBtn").addEventListener("click", () => toggle("right"));
$("consoleBtn").addEventListener("click", () => toggle("console"));
window.addEventListener("resize", () => {
  /* Dragging a wide window narrow with both panels open would leave the note
     under two overlays at once. */
  if (window.innerWidth <= 900 && document.body.dataset.left === "on"
      && document.body.dataset.right === "on") panel("right", false);
  spy();
}, {passive: true});
/* Re-render often enough that "3 minutes ago" stays honest, but ask the server
   less often — a status call can spawn a systemctl and a handful of gits. */
setInterval(drawFoot, 30 * 1000);
setInterval(refreshStatus, 60 * 1000);
$("newBtn").addEventListener("click", openDialog);
$("trashBtn").addEventListener("click", trashNote);
$("dlgCancel").addEventListener("click", closeDialog);
$("dlgOk").addEventListener("click", createNote);
$("dlgName").addEventListener("keydown", e => { if (e.key === "Enter") createNote(); });
$("veil").addEventListener("click", e => { if (e.target === $("veil")) closeDialog(); });

document.querySelectorAll(".seg button").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".seg button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    document.body.className = "mode-" + b.dataset.mode;
    try { localStorage.setItem("notes-mode", b.dataset.mode); } catch (e) {}
    /* Only one of the two rendered panes holds the note at a time, so the
       one being switched to has to be filled before it is looked at. */
    if (current) preview();
    spy();
  });
});

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s"){ e.preventDefault(); save(); }
  if ((e.ctrlKey || e.metaKey) && e.key === "n"){ e.preventDefault(); openDialog(); }
  if (mod(e) && !e.altKey && !e.shiftKey){
    if (e.key === "b"){ e.preventDefault(); toggle("left"); }
    if (e.key === "e"){ e.preventDefault(); toggle("right"); }
    if (e.key === "j"){ e.preventDefault(); toggle("console"); }
  }
  if (e.key === "Escape"){
    if ($("veil").classList.contains("open")) closeDialog();
    else if (document.activeElement === qEl){ qEl.value = ""; drawList(""); qEl.blur(); }
    else if (document.body.dataset.console === "on") panel("console", false);
  }
  if (e.key === "/" && document.activeElement !== qEl && document.activeElement !== edEl
      && !$("veil").classList.contains("open")){
    e.preventDefault(); qEl.focus(); qEl.select();
  }
});

window.addEventListener("beforeunload", e => {
  if (dirty){ e.preventDefault(); e.returnValue = ""; }
});

(async function(){
  try{
    let mode = null;
    try { mode = localStorage.getItem("notes-mode"); } catch (e) {}
    if (mode){
      document.body.className = "mode-" + mode;
      document.querySelectorAll(".seg button").forEach(x =>
        x.classList.toggle("on", x.dataset.mode === mode));
    }
    restorePanels();
    await reload();
    $("boot").remove();
    const readme = NOTES.find(n => n.path === "README.md") || NOTES[0];
    if (readme) open_(readme.path);
    else drawOutline();
    /* After the notes are up: the panels are usable without it, and it is the
       one call that can spawn subprocesses on the server.                   */
    refreshStatus();
  } catch (e){
    $("boot").textContent = "Could not reach the notes server: " + e.message;
  }
})();
</script>
